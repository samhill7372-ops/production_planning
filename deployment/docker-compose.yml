version: '3.8'

services:
  # ==========================================================================
  # 2024 Model Services
  # ==========================================================================
  yield-2024-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8001:8000"
    environment:
      - MODEL_YEAR=2024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  yield-2024-ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://yield-2024-api:8000
    restart: unless-stopped
    depends_on:
      - yield-2024-api

  # ==========================================================================
  # 2025 Model Services
