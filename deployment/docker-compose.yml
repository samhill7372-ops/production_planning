version: '3.8'

services:
  yield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yield-predictor
    ports:
      - "8000:8000"
    environment:
      - MODEL_YEAR=2024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
